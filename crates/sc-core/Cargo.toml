[package]
name = "sc-core"
description = "Core RandomForest engine for sc (pure Rust): classification + regression fit/predict, probabilities, feature importances, RFECV, tuning, nested/OOF CV, and TreeSHAP — Arrow-free, FFI-free, wasm-friendly."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["random-forest", "machine-learning", "classification", "shap", "wasm"]
categories = ["science", "algorithms", "wasm"]
# Minimum supported Rust version (informational). Chosen as a recent stable; the
# project is built/tested on current stable and does not gate on this in CI.
rust-version = "1.85"
# Internal v1: descriptive metadata, but not published to crates.io.
publish = false

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
# default-features = false drops `os_rng`, which pulls `getrandom` — we never
# seed from OS entropy (seeds are always explicit), and getrandom does not build
# for wasm32 without a backend. See sc-design.html §11.
rand = { version = "0.10", default-features = false }
# rand_chacha's default features are just `std` (no getrandom), so it is
# wasm-safe as-is; the pinned 0.10 line freezes the value-stable ChaCha8 stream.
rand_chacha = "0.10"
rayon = { version = "1", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }
# default-features = false drops statrs's nalgebra-backed multivariate
# distributions (which we never use), keeping the metrics module pure-Rust and
# wasm-clean. We need only the univariate Student's t CDF for regression
# p-values. See sc-design.html §11 and the M1 plan.
statrs = { version = "0.18", default-features = false }

[features]
default = ["parallel", "persist"]
parallel = ["dep:rayon"]
# Model persistence (serde + postcard envelope). Optional + default-features=false
# so the shipped crate stays wasm-clean; default-on so a plain build can save a
# trained model, while the `--no-default-features` wasm/test-seq gates keep
# verifying a minimal serde-free core.
persist = ["dep:serde", "dep:postcard"]

[dev-dependencies]
sc-oracle = { path = "../sc-oracle" }
# Already in the graph via the optional `parallel` dependency; declared here so
# the `parallel`-gated thread-count-invariance test in tests/determinism.rs can
# drive explicit rayon thread pools (mirroring exec.rs's own unit test).
rayon = "1"

# The persist example needs the `persist` feature; `required-features` makes
# cargo skip it (rather than fail) under `--no-default-features`. The
# fit_predict_shap example uses only always-available API and is auto-discovered.
[[example]]
name = "persist_roundtrip"
required-features = ["persist"]

[lints]
workspace = true
