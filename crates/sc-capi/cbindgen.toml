language = "C"
pragma_once = true
tab_width = 4
style = "type"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "doxy"

sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
no_includes = true

header = """
/* sc — pure-Rust RandomForest engine. C-API (M9). GENERATED by cbindgen from
 * crates/sc-capi; do not edit by hand. Regenerated on every `cargo build`. */"""

# The canonical Arrow C Data Interface structs, so this header is self-contained
# and interoperable with any Arrow producer. sc's Rust side uses arrow-rs's
# `FFI_ArrowArray`/`FFI_ArrowSchema`, which are laid out identically; the
# `[export.rename]` rules below make cbindgen reference these names by value.
after_includes = """

#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

struct ArrowSchema {
    const char *format;
    const char *name;
    const char *metadata;
    int64_t flags;
    int64_t n_children;
    struct ArrowSchema **children;
    struct ArrowSchema *dictionary;
    void (*release)(struct ArrowSchema *);
    void *private_data;
};

struct ArrowArray {
    int64_t length;
    int64_t null_count;
    int64_t offset;
    int64_t n_buffers;
    int64_t n_children;
    const void **buffers;
    struct ArrowArray **children;
    struct ArrowArray *dictionary;
    void (*release)(struct ArrowArray *);
    void *private_data;
};

#endif  /* ARROW_C_DATA_INTERFACE */
"""

[export.rename]
# Bridge arrow-rs's FFI structs to the canonical Arrow names defined above.
# ABI-identical, so this is purely a naming substitution.
"FFI_ArrowArray" = "struct ArrowArray"
"FFI_ArrowSchema" = "struct ArrowSchema"

[enum]
rename_variants = "None"
prefix_with_name = false

[parse]
parse_deps = false
