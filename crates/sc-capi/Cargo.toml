[package]
name = "sc-capi"
description = "The reentrant sc_* C-API: opaque handles, Arrow I/O, panic-safe ABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# staticlib for the C harness / valgrind; cdylib for a shipped shared object.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sc-core = { path = "../sc-core", features = ["persist", "parallel"] }
sc-arrow = { path = "../sc-arrow" }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
rayon = "1"

[build-dependencies]
# Build-time only: regenerates include/sc.h every build so the header can't
# drift. MPL-2.0 (a build tool, never linked/shipped) is scoped in deny.toml.
cbindgen = { version = "0.29", default-features = false }

[lints]
workspace = true
