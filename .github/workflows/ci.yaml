name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (parallel)
        run: cargo test --all-features
      # Scoped to sc-core/sc-oracle: a workspace-wide --no-default-features would
      # let sc-arrow/sc-capi re-enable persist+parallel on sc-core via feature
      # unification, so this gate would stop testing the minimal serde/rayon-free
      # core.
      - name: test (sequential)
        run: cargo test -p sc-core -p sc-oracle --no-default-features

  capi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # `make capi` builds the staticlib + regenerates include/sc.h; `ctest`
      # compiles and runs the C harness; `leaks` runs it under valgrind.
      - name: C-API harness + leak check
        run: make capi ctest leaks

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # unknown-unknown = the shipped artifact; wasip1 = the target the
          # determinism parity suite executes on under wasmtime.
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      # wasmtime runs the wasip1 test binaries (the cargo runner is set in
      # .cargo/config.toml). The bytecodealliance action avoids install-script
      # network flakiness.
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: build wasm32 (minimal core)
        run: cargo build -p sc-core --target wasm32-unknown-unknown --no-default-features
      - name: build wasm32 (with persist)
        run: cargo build -p sc-core --target wasm32-unknown-unknown --no-default-features --features persist
      # Fail if any native-only dep (rayon/getrandom/crossbeam/arrow) reached the
      # shipped wasm tree.
      - name: wasm dependency-surface audit
        run: make wasm-audit
      # The frozen golden/digest suite on a wasm VM: green == native == wasm.
      - name: determinism parity (wasm32-wasip1 under wasmtime)
        run: make wasm-test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
