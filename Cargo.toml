[workspace]
resolver = "2"
members = ["crates/sc-core", "crates/sc-oracle", "crates/sc-arrow", "crates/sc-capi"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Daniel McDonald <d3mcdonald@health.ucsd.edu>"]
# Minimum supported Rust version, inherited by every crate. A hard floor, not a
# guess: duckdb-miint builds sc-capi for wasm32-unknown-emscripten with Rust
# pinned to 1.86.0 (for its emsdk 3.1.71 / binaryen). Declaring it makes
# clippy's `incompatible_msrv` reject std APIs stabilized later (and stops
# `manual_is_multiple_of` from steering code onto 1.87's `is_multiple_of`); the
# CI `msrv` job (`make msrv`) compiles the C-API with exactly that toolchain and
# target.
rust-version = "1.86"

# Arrow C Data Interface, pinned once here so sc-arrow and sc-capi never drift
# apart (an ABI mismatch between the two would be a memory-safety bug, not a
# compile error). Split crates (no arrow / arrow-ipc) keep the native lib lean;
# `default-features = false` drops the heavy compute/IPC stack we never use.
[workspace.dependencies]
# `ffi` on arrow-array cascades to arrow-schema/ffi + arrow-data/ffi (the C Data
# Interface `to_ffi`/`from_ffi` + `FFI_ArrowArray`/`FFI_ArrowSchema`).
arrow-array = { version = "59", default-features = false, features = ["ffi"] }
arrow-schema = { version = "59", default-features = false, features = ["ffi"] }
arrow-data = { version = "59", default-features = false, features = ["ffi"] }
arrow-buffer = { version = "59", default-features = false }

[workspace.lints.clippy]
all = "warn"
