# Vulnerability / yanked-crate gate for the release. `version = 2` selects
# cargo-deny's current advisory semantics (vulnerabilities always deny;
# unmaintained/unsound handled by built-in defaults); `yanked = "deny"` makes a
# yanked dependency a hard blocker rather than a warning. Needs an advisory-DB
# clone — CI's cargo-deny-action supplies one; `make deny` uses the local cache.
[advisories]
version = 2
yanked = "deny"

[licenses]
# Permissive licenses compatible with this project's BSD-3-Clause distribution.
allow = [
    "BSD-3-Clause",
    "BSD-2-Clause",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    # CC0-1.0 (public-domain dedication, more permissive than MIT, no copyleft):
    # tiny-keccak, pulled by ahash's compile-time-rng under arrow-array. Only in
    # the native sc-arrow/sc-capi tree — never the wasm-clean sc-core build.
    "CC0-1.0",
    # cbindgen (MPL-2.0) is a build-time-only codegen tool for sc-capi — never
    # linked into or shipped with any artifact. MPL-2.0's file-level copyleft
    # covers cbindgen's own sources, not the generated header (a build product)
    # nor our BSD-3-Clause libraries, so it is safe to allow here.
    "MPL-2.0",
]

[bans]
# Warn, not deny: the duplicate versions in the graph (getrandom x3, r-efi x2,
# winnow x2) arise from two independent, non-wasm sources — (a) the native FFI
# runtime: ahash's entropy backend under arrow (getrandom 0.3 + its r-efi
# backend) plus ahash's compile-time-rng (getrandom 0.2 via const-random); and
# (b) the cbindgen build-tool tree: tempfile pulls getrandom 0.4 + its r-efi
# backend, and cbindgen's toml parser pulls two winnow lines. Every one lives
# solely in the native sc-arrow / sc-capi and build-time trees — none reach the
# wasm-clean sc-core surface, which ci/wasm-audit.sh enforces independently.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
